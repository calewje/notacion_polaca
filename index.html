<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calculadora Desglosada</title>
</head>
<body>
  <div class="container mt-5">
    <h1 class="text-center"> Calculadora Polaca</h1>
      <div class="col-12">
        <div class="card p-4 shadow mt-4">
          <div class="mb-3"> 
            <label for="opePolaca" class="form-label">Ingresa una operación</label>
            <input type="text" class="form-control" id="opePolaca" placeholder="Ejemplo: * 3 + 3 2 separado por espacios" />
          </div>
  
          <input type="text" id="opeNormal" class="form-control mt-2 mb-2" >
          <input type="text" id="resul" class="form-control " >
          <button id="btn_almacenar"  class="btn btn-warning mt-4 mb-2 w-100">Almacenar</button>

        </div>
      </div>
     
  </div>

  <script src="./bundle.js"></script>
</body>
</html>
